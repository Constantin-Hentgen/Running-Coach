services:
  running-coach:
    build: .
    container_name: running-coach
    restart: unless-stopped
    # Configuration (voir .env.example), selon le mode de déploiement :
    # - docker compose en local : fichier .env à côté de ce fichier ;
    # - Portainer (stack depuis un dépôt Git) : variables saisies dans l'UI du stack,
    #   que Portainer écrit dans stack.env.
    # Les deux sont facultatifs : seul celui qui existe est chargé.
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false
    environment:
      COACH_DATA_DIR: /data
      TZ: ${COACH_TZ:-Europe/Paris}
    ports:
      - "${COACH_PORT:-18000}:8000"
    volumes:
      - coach-data:/data

volumes:
  coach-data:
