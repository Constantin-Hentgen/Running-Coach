services:
  running-coach:
    build: .
    container_name: running-coach
    restart: unless-stopped
    # Configuration : chaque variable est lue par interpolation ${VAR}, ce qui marche partout :
    # - docker compose en local : lues dans le fichier .env à côté de ce fichier ;
    # - Portainer (stack depuis un dépôt Git) : variables saisies dans l'UI du stack.
    # Une variable absente arrive vide et prend la valeur par défaut du code (voir .env.example).
    # Les lignes parasites (vides, commentaires) de l'UI Portainer sont ignorées.
    environment:
      # Anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      CLAUDE_PLANNING_MODEL: ${CLAUDE_PLANNING_MODEL:-}
      CLAUDE_MAX_TOKENS: ${CLAUDE_MAX_TOKENS:-}
      CLAUDE_MAX_TOOL_ROUNDS: ${CLAUDE_MAX_TOOL_ROUNDS:-}
      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Radicale
      RADICALE_URL: ${RADICALE_URL:-}
      RADICALE_USER: ${RADICALE_USER:-}
      RADICALE_PASS: ${RADICALE_PASS:-}
      RADICALE_SHOPPING_URL: ${RADICALE_SHOPPING_URL:-}
      RADICALE_TASKS_URL: ${RADICALE_TASKS_URL:-}   # ancien nom de RADICALE_SHOPPING_URL
      # Dreeve
      DREEVE_URL: ${DREEVE_URL:-}
      DREEVE_API_URL: ${DREEVE_API_URL:-}
      DREEVE_API_KEY: ${DREEVE_API_KEY:-}
      DREEVE_MCP_KEY: ${DREEVE_MCP_KEY:-}
      DREEVE_MCP_URL: ${DREEVE_MCP_URL:-}
      DREEVE_RUN_TYPES: ${DREEVE_RUN_TYPES:-}
      # GIF
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      # Météo
      WEATHER_LOCATIONS: ${WEATHER_LOCATIONS:-}
      WEATHER_LAT: ${WEATHER_LAT:-}
      WEATHER_LON: ${WEATHER_LON:-}
      WEATHER_API_URL: ${WEATHER_API_URL:-}
      # Alertes météo
      RAIN_ALERT_CHECK_MINUTES: ${RAIN_ALERT_CHECK_MINUTES:-}
      RAIN_ALERT_HOURS_AHEAD: ${RAIN_ALERT_HOURS_AHEAD:-}
      RAIN_ALERT_PROBABILITY: ${RAIN_ALERT_PROBABILITY:-}
      RAIN_ALERT_MIN_MM: ${RAIN_ALERT_MIN_MM:-}
      RAIN_ALERT_SKIP_KEYWORDS: ${RAIN_ALERT_SKIP_KEYWORDS:-}
      WEATHER_ALERT_HEAT_C: ${WEATHER_ALERT_HEAT_C:-}
      WEATHER_ALERT_GUST_KMH: ${WEATHER_ALERT_GUST_KMH:-}
      WEATHER_ALERT_FREEZE_C: ${WEATHER_ALERT_FREEZE_C:-}
      # Coach
      BOT_NAME: ${BOT_NAME:-}
      COACH_TZ: ${COACH_TZ:-}
      BRIEFING_TIME: ${BRIEFING_TIME:-}
      WEEKLY_REVIEW_TIME: ${WEEKLY_REVIEW_TIME:-}
      PANTRY_CHECK_TIME: ${PANTRY_CHECK_TIME:-}
      MEAL_CHECK_TIMES: ${MEAL_CHECK_TIMES:-}
      EAT_SUGGEST_TIMES: ${EAT_SUGGEST_TIMES:-}
      SHOP_LAST_CALL: ${SHOP_LAST_CALL:-}
      NEW_DISH_TIME: ${NEW_DISH_TIME:-}
      NUTRITION_CHECK_TIME: ${NUTRITION_CHECK_TIME:-}
      MEAL_BOXES: ${MEAL_BOXES:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-}
      ACTIVITY_POLL_MINUTES: ${ACTIVITY_POLL_MINUTES:-}
      PLANNING_HORIZON_DAYS: ${PLANNING_HORIZON_DAYS:-}
      CALENDAR_CONTEXT_DAYS: ${CALENDAR_CONTEXT_DAYS:-}
      HISTORY_MESSAGES: ${HISTORY_MESSAGES:-}
      COACH_SEED_MEMORY: ${COACH_SEED_MEMORY:-}
      # Technique
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      COACH_DATA_DIR: /data
      TZ: ${COACH_TZ:-Europe/Paris}
    ports:
      - "${COACH_PORT:-18000}:8000"
    volumes:
      - coach-data:/data

volumes:
  coach-data:
