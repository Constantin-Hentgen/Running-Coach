[project]
name = "running-coach-agent"
version = "3.1.0"
description = "Autonomous Telegram Running Coach Agent"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-telegram-bot>=21.0",
    "caldav>=1.3.0",
    "icalendar>=6.0",
    "apscheduler>=3.10.4,<4",
    "anthropic>=0.40.0",
    "requests>=2.31.0",
    "tzdata",
    "mcp>=2.0",
    "faster-whisper>=1.1",
    "av>=11,<19",
    "staticmap>=0.5.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
